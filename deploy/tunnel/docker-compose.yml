services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vibe-prompt-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    # Acceso al servidor nativo corriendo en el host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:
    driver: bridge
