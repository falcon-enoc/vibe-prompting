# Vibe Prompt — reverse proxy nginx
# Usar solo si expones el servidor fuera de la LAN (con TLS)
# Reemplaza stt.yourdomain.com con tu dominio real

upstream vibe_prompt_backend {
    server 127.0.0.1:8420;
    keepalive 4;
}

server {
    listen 80;
    server_name stt.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stt.yourdomain.com;

    ssl_certificate     /etc/ssl/certs/stt.yourdomain.com.pem;
    ssl_certificate_key /etc/ssl/private/stt.yourdomain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audio uploads pueden ser grandes (2 min ≈ 3.8 MB)
    client_max_body_size 20M;

    location / {
        proxy_pass http://vibe_prompt_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://vibe_prompt_backend/health;
        access_log off;
    }
}
